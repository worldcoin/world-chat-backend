name: Daily job

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read
  packages: write

jobs:
  run:
    runs-on:
      group: arc-public-large-amd64-runner
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: "wc-cicd"
          password: ${{ secrets.GH_PAT }}
      - name: Pull image
        run: |
          docker pull ghcr.io/worldcoin/world-chat-secure-enclave-signed:latest
      - name: Log in to the GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push to GHCR
        run: |
          docker tag ghcr.io/worldcoin/world-chat-secure-enclave-signed:latest ghcr.io/worldcoin/world-chat-secure-enclave-signed-public:latest
          docker push ghcr.io/worldcoin/world-chat-secure-enclave-signed-public:latest