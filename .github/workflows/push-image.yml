name: Daily job

#on:
#  schedule:
#    - cron: "0 3 * * *"
#  workflow_dispatch: {}

on:
  push:
    branches:
      - INFRA-5677/publish-docker-image
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read
  packages: read
#  packages: write


jobs:
  run:
    runs-on:
      group: arc-public-large-amd64-runner
#    environment: prod
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: "ernish"
          password: ${{ secrets.GH_PAT }}
      - name: Pull image
        run: |
          docker pull ghcr.io/worldcoin/world-chat-secure-enclave-signed-dev:secure-enclave-v2-6d989e651a6e7d3a72e107eb4c0e151ebd13ff44-5a54dafdbdd8fbb90778f3df272207b910989438
          docker images | head
      - name: Push to GHCR
        run: |
          docker tag 507152310572.dkr.ecr.eu-central-1.amazonaws.com/world-chat-secure-enclave-signed-dev:${{ needs.build-and-push.outputs.image_tag }} ${{ env.GHCR }}/worldcoin/world-chat-secure-enclave-signed:latest
          docker push ${{ env.GHCR }}/worldcoin/world-chat-secure-enclave-signed:latest